name: Release freeze
description: Keep pull requests that change a workflow file from merging while a release runs, through the release-freeze commit status.
inputs:
  mode:
    description: >-
      "pull-request" on a pull request's push sets that pull request's status. "start" as a release's first job
      freezes the open pull requests that change a workflow file. "end" as its last job, with if always(), thaws them.
    required: true
  workflow:
    description: The release workflow's file name.
    default: release.yml
  token:
    description: Token with statuses write, pull requests read and actions read on the repository.
    default: ${{ github.token }}
outputs:
  frozen:
    description: The pull request numbers set to failure, as JSON.
  thawed:
    description: The pull request numbers set to success, as JSON.
runs:
  using: node24
  main: index.js
