name: Tag probe

# Temporary (changed after the source): does the job's own token create a tag at a commit whose workflow files differ from main's?
on:
  workflow_dispatch:
    inputs:
      sha: { required: true, type: string }

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Through a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create probe-release --repo "$GITHUB_REPOSITORY" --target "${{ inputs.sha }}" --title probe --notes probe --draft=false 2>&1 || echo "RELEASE REFUSED"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/probe-release" --jq '"tag at \(.object.sha)"' || true
