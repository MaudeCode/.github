name: Tag probe

# Temporary: can a run tag its own commit with a deploy key after main's workflow files have changed?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: sleep 75
      - name: Tag this run's own commit with a deploy key
        env:
          KEY: ${{ secrets.PROBE_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q probe && cd probe
          git fetch -q --depth 1 "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          echo "run commit $GITHUB_SHA, main now $(git ls-remote "git@github.com:$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          git -c user.name=probe -c user.email=probe@example.com tag -a probe-key -m probe FETCH_HEAD
          git push "git@github.com:$GITHUB_REPOSITORY.git" refs/tags/probe-key 2>&1 || echo "KEY PUSH REFUSED"
